<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Bounty Reporting Portal</title>

<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    padding: 30px;
    color: #333;
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
  }

  .task-input {
    max-width: 900px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }

  .field {
    display: flex;
    flex-direction: column;
  }

  .full {
    grid-column: 1 / -1;
  }

  label {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 5px;
  }

  input, select, textarea {
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  textarea {
    resize: vertical;
    min-height: 120px;
    font-family: monospace;
  }

  button {
    padding: 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
    font-size: 14px;
  }

  .add { background: #3498db; }
  .complete { background: #2ecc71; }
  .delete { background: #e74c3c; }
  .report {
    background: #9b59b6;
    display: block;
    margin: 25px auto;
    padding: 12px 18px;
  }

  ul {
    list-style: none;
    padding: 0;
    max-width: 900px;
    margin: 30px auto;
  }

  li {
    background: white;
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 2px 4px rgba(0,0,0,.08);
  }

  li.completed {
    opacity: .6;
    text-decoration: line-through;
  }

  .left { flex: 1; }

  .priority {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 4px;
    color: white;
    font-size: 12px;
    margin-bottom: 6px;
  }

  .critical { background: #8e0000; }
  .high { background: #e74c3c; }
  .medium { background: #f39c12; }
  .low { background: #3498db; }

  .notes {
    margin-top: 8px;
    font-size: 14px;
    white-space: pre-wrap;
    cursor: pointer;
  }

  .resolver {
    font-size: 13px;
    font-style: italic;
    margin-top: 6px;
  }

  footer {
    text-align: center;
    margin-top: 40px;
    font-size: 13px;
    color: #666;
  }

  @media (max-width: 700px) {
    .task-input {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>

<body>

<h1>Vulnerability Reporting</h1>

<div class="task-input">

  <div class="field">
    <label>Vulnerability Title</label>
    <input id="title" placeholder="e.g. Stored XSS in comments endpoint">
  </div>

  <div class="field">
    <label>Affected Hostname / Asset</label>
    <input id="hostname" placeholder="example.com / api.example.com">
  </div>

  <div class="field">
    <label>Severity</label>
    <select id="severity">
      <option>Critical</option>
      <option>High</option>
      <option>Medium</option>
      <option>Low</option>
    </select>
  </div>

  <div class="field">
    <label>Date Reported</label>
    <input id="reportDate" type="date">
  </div>

  <div class="field full">
    <label>Description / PoC / Impact</label>
    <textarea id="notes" placeholder="Steps to reproduce, payloads, screenshots, impact..."></textarea>
  </div>

  <div class="field full">
    <button class="add" onclick="addReport()">Submit Vulnerability</button>
  </div>

</div>

<ul id="list"></ul>

<button class="report" onclick="generateClientReport()">Generate Client HTML Report</button>

<footer>
  2026 © Vulnerability Portal – Internal Use Only • jgu@rd
</footer>

<script>
const STORAGE_KEY = "bug_bounty_autosave";
const list = document.getElementById("list");

reportDate.value = new Date().toISOString().split("T")[0];

function save() {
  const data = [];
  document.querySelectorAll("li").forEach(li => {
    data.push({
      title: li.dataset.title,
      hostname: li.dataset.hostname,
      notes: li.dataset.notes,
      date: li.dataset.date,
      severity: li.dataset.severity,
      resolved: li.classList.contains("completed"),
      resolver: li.dataset.resolver || ""
    });
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function load() {
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  list.innerHTML = "";
  data.forEach(render);
}

function render(r) {
  const li = document.createElement("li");
  Object.assign(li.dataset, r);

  if (r.resolved) li.classList.add("completed");

  const left = document.createElement("div");
  left.className = "left";
  left.innerHTML = `
    <span class="priority ${r.severity.toLowerCase()}">${r.severity}</span>
    <strong>${r.title}</strong>
    <div><strong>Hostname:</strong> ${r.hostname || "N/A"}</div>
    <div><strong>Date:</strong> ${r.date}</div>
    <div class="notes">${r.notes}</div>
    ${r.resolver ? `<div class="resolver">Resolved by: ${r.resolver}</div>` : ""}
  `;

  const actions = document.createElement("div");

  const resolve = document.createElement("button");
  resolve.textContent = "Resolve";
  resolve.className = "complete";
  resolve.onclick = () => {
    if (li.classList.contains("completed")) return;
    const name = prompt("Resolver name:");
    if (!name) return;
    li.dataset.resolver = name;
    li.classList.add("completed");
    left.innerHTML += `<div class="resolver">Resolved by: ${name}</div>`;
    save();
  };

  const del = document.createElement("button");
  del.textContent = "Delete";
  del.className = "delete";
  del.onclick = () => { li.remove(); save(); };

  actions.append(resolve, del);
  li.append(left, actions);
  list.appendChild(li);
  save();
}

function addReport() {
  if (!title.value.trim()) return;
  render({
    title: title.value.trim(),
    hostname: hostname.value.trim(),
    notes: notes.value.trim(),
    date: reportDate.value,
    severity: severity.value,
    resolved: false
  });
  title.value = hostname.value = notes.value = "";
}

function generateClientReport() {
  const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (!data.length) return alert("No data to report.");

  const html = `
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Security Report</title></head>
<body style="font-family:Arial;padding:40px;">
<h1>Security Vulnerability Report</h1>
${data.map((d,i)=>`
<h3>${i+1}. ${d.title}</h3>
<p><strong>Severity:</strong> ${d.severity}</p>
<p><strong>Hostname:</strong> ${d.hostname}</p>
<p><strong>Date:</strong> ${d.date}</p>
<pre>${d.notes}</pre><hr>`).join("")}
</body></html>`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download = "security_report.html";
  a.click();
}

window.onload = load;
</script>

</body>
</html>
